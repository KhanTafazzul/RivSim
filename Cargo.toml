[package]
name = "rivsim"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI & Parallelism
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"

# Math & Physics
glam = "0.33"
rapier2d = "0.36"

# Dynamic Library Loading
libloading = "0.8"

# Visualizer
macroquad = "0.4"

# Async Runtime & Networking
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
axum = "0.7"

# MCP Server
rmcp = { version = "3.11", features = ["server", "transport-streamable-http-server", "schemars"] }
schemars = "1.0"

# Serialization & Crypto
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
rand = "0.8"
crossbeam-channel = "0.5"
